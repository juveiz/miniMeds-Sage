[project]
authors = [{name = "Juan Velasco", email = "juvel25@student.sdu.dk"}]
dependencies = ["numpy", "matplotlib", "pytest", "ruff>=0.16.6,<0.17"]
name = "miniMeds-Sage"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
minimeds_sage = { path = ".", editable = true }

[tool.pixi.tasks]
fmt = "ruff format src tests scripts"
fmt-check = "ruff format --check src tests scripts"
lint = "ruff check src tests scripts"
lint-fix = "ruff check --fix src tests scripts"
test = "pytest tests"
demo = "python scripts/demo_keygen.py"
check = { depends-on = ["fmt-check", "lint", "test"] }

[tool.pixi.dependencies]
sage = ">=10.9,<11"
